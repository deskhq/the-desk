# Production stack for Dokploy, which fronts compose services with its own
# injected Traefik network. Point Dokploy's Compose Path at this file and never
# edit YAML; the walkthrough is at
# https://docs.thedeskhq.app/self-hosting/dokploy/. Another PaaS of the same
# shape (Coolify, say) needs this file with its own network name in place of
# dokploy-network.
#
# It is docker-compose.prod.yml (read that file for the rationale behind every
# setting) with exactly two differences, which
# tests/Unit/DokployComposeTemplateTest.php holds it to:
#
#   1. No `ports:`. Traefik reaches the containers over dokploy-network, and
#      reverb's 127.0.0.1:8080 would collide with Dokploy's Traefik dashboard.
#   2. `app` and `reverb` join the external dokploy-network, alongside the
#      stack's implicit `default` network.
#
# On a bare VPS with your own reverse proxy, use docker-compose.prod.yml instead.

x-infra-depends-on: &infra-depends-on
  pgsql:
    condition: service_healthy
  redis:
    condition: service_healthy
  meilisearch:
    condition: service_healthy

x-worker-depends-on: &worker-depends-on
  <<: *infra-depends-on
  app:
    condition: service_started

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/deskhq/the-desk:${APP_VERSION:?APP_VERSION is required — set it in .env (see .env.prod.example) or override APP_IMAGE}}
  env_file:
    - .env
  restart: unless-stopped
  volumes:
    - ./.env:/app/.env:ro
    - storage-app:/app/storage/app
    # Operator brand overrides, mirroring docker-compose.prod.yml. Empty by
    # default, in which case every asset falls back to the shipped one.
    - ./branding:/app/storage/branding:ro
  depends_on: *infra-depends-on

# `default` keeps the proxied services on the stack network, so they still
# resolve pgsql, redis, and each other by name once Dokploy attaches a domain.
x-proxied-networks: &proxied-networks
  - default
  - dokploy-network

services:
  app:
    <<: *app
    environment:
      AUTORUN_MIGRATIONS: 'true'
    networks: *proxied-networks
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/up']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  reverb:
    <<: *app
    command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
    depends_on: *worker-depends-on
    networks: *proxied-networks
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/up']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  queue:
    <<: *app
    command: ['php', 'artisan', 'queue:work', '--queue=broadcasts,default', '--sleep=0', '--tries=3']
    depends_on: *worker-depends-on

  queue-broadcasts:
    <<: *app
    command: ['php', 'artisan', 'queue:work', '--queue=broadcasts', '--sleep=0', '--tries=3']
    depends_on: *worker-depends-on

  scheduler:
    <<: *app
    command: ['php', 'artisan', 'schedule:work']
    depends_on: *worker-depends-on

  # Link unfurling. A URL a member typed into a message is the one thing this
  # application fetches on somebody else's say-so, and the process that parses
  # what comes back is the one process that should hold nothing.
  #
  # It ships in the same image as the app — one artifact, one scan, one
  # attestation, one APP_VERSION to pin — but it deliberately does NOT use the
  # `*app` anchor, and that is the point rather than an omission. The anchor
  # carries `env_file: .env`, a bind of the physical .env, the shared storage
  # volume and the branding mount; handing all of that to the HTML parser is most
  # of what isolating it was for. `entrypoint:` overrides the image's own, so the
  # Go process also never pays for docker/entrypoint.sh's artisan cache warm-up.
  # tests/Unit/ProductionComposeStorageVolumeTest.php fails if this drifts back.
  #
  # No `ports:`, so it is reachable only as `unfurler:8080` on this network, and
  # UNFURLER_TOKEN is what stops another container on that same network using it
  # as an unauthenticated fetcher. Set both it and UNFURLER_URL in .env; a fresh
  # install gets them from ./docker/gen-secrets.sh and an upgrade is told about
  # them by docker/env-sync.sh.
  #
  # No `depends_on` either: it needs neither the database, the cache nor the
  # search index, and an edge from `queue` to here would let a wedged unfurler
  # stop the queue worker from ever starting. Degrading gracefully is the design.
  #
  # An operator running a customised compose file who never adds this service
  # loses link previews and nothing else: previews resolve to Failed, no card
  # renders, and every message still posts, edits, broadcasts and searches. See
  # docs/self-hosting/upgrading.
  unfurler:
    image: ${APP_IMAGE:-ghcr.io/deskhq/the-desk:${APP_VERSION:?APP_VERSION is required — set it in .env (see .env.prod.example) or override APP_IMAGE}}
    entrypoint: ['/usr/local/bin/unfurler']
    restart: unless-stopped
    environment:
      UNFURLER_LISTEN: ':8080'
      # No `:?` guard. A missing token must fail this one service loudly — it
      # refuses to boot and restart-loops, which `docker compose ps` shows —
      # rather than failing the whole `docker compose up` for an operator who
      # upgraded without syncing .env.
      UNFURLER_TOKEN: ${UNFURLER_TOKEN:-}
      UNFURLER_LOG_LEVEL: ${UNFURLER_LOG_LEVEL:-info}
      UNFURLER_MAX_CONCURRENCY: ${UNFURLER_MAX_CONCURRENCY:-16}
      # The SSRF guard keeps its webhook-era name across the whole application,
      # so an operator who deliberately turned it off has it off here too. See
      # config/integrations.php.
      WEBHOOKS_BLOCK_PRIVATE_URLS: ${WEBHOOKS_BLOCK_PRIVATE_URLS:-true}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgsql:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgsql-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-laravel}', '-U', '${DB_USERNAME:-laravel}']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:${MEILISEARCH_VERSION:-v1.49}
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY is required}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: ${MEILISEARCH_NO_ANALYTICS:-true}
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://127.0.0.1:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

# Created by Dokploy and shared by every application it deploys; Traefik is
# attached to it. Declared explicitly rather than left to Dokploy's injection so
# `reverb` reaches it too: injection only rewrites the services a domain is
# attached to.
networks:
  dokploy-network:
    external: true

volumes:
  pgsql-data:
  meili-data:
    name: the-desk-meili-${MEILISEARCH_VERSION:-v1.49}
  redis-data:
  storage-app:
